{% extends 'layout.html' %}
{% block title %}{{ accion }} Género — Emysic{% endblock %}
{% block topbar_title %}{{ accion }} Género{% endblock %}

{% block content %}
<div class="d-flex align-items-center gap-3 mb-4">
    <a href="{{ url_for('generos') }}" class="icon-btn" title="Volver"
       style="width:36px;height:36px;">
        <i class="bi bi-arrow-left"></i>
    </a>
    <div>
        <h1 class="page-heading">{{ accion }} Género</h1>
    </div>
</div>

<div class="em-card" style="max-width:580px;">
    {% if error %}
    <div class="alert-em mb-3">
        <i class="bi bi-exclamation-circle me-2"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-tag me-1"></i> Nombre del género *
            </label>
            <input type="text" name="nombre" class="form-control"
                   value="{{ genero[1] if genero else '' }}"
                   required placeholder="ej. Pop, Rock...">
        </div>
        <div class="mb-3">
            <label class="form-label">
                <i class="bi bi-card-text me-1"></i> Descripción
            </label>
            <textarea name="descripcion" class="form-control" rows="3"
                      placeholder="Breve descripción del género...">{{ genero[2] if genero else '' }}</textarea>
        </div>
        {% if genero %}
        <div class="mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="lActivo"
                       id="lActivo" {{ 'checked' if genero[3] }}
                       style="background-color:#111;border-color:#2e2e2e;">
                <label class="form-check-label form-label mb-0" for="lActivo">
                    Género activo
                </label>
            </div>
        </div>
        {% endif %}

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger"
                    style="border-radius:8px;padding:.55rem 1.4rem;">
                <i class="bi bi-check-lg me-1"></i> {{ accion }}
            </button>
            <a href="{{ url_for('generos') }}" class="btn btn-sm"
               style="background:var(--em-surface);border:1px solid var(--em-border);
                      color:var(--em-text);border-radius:8px;padding:.55rem 1.2rem;">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
