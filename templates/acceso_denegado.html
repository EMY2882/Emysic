{% extends 'layout.html' %}

{% block topbar_title %}Acceso denegado{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div style="font-size:4rem;color:var(--em-red);">
        <i class="bi bi-shield-lock-fill"></i>
    </div>
    <h2 style="font-family:'Bebas Neue',sans-serif;letter-spacing:2px;margin-top:1rem;color:#f0f0f0;">
        Acceso denegado
    </h2>
    <p style="color:var(--em-muted);margin-top:.5rem;">

    </a>
